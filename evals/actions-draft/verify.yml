name: Verify Gatehouse receipt

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: gatehouse-verify-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '/receipt.html#a=')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
      GATEHOUSE_ORIGIN: ${{ vars.GATEHOUSE_ORIGIN }}
    steps:
      - name: Install Playwright client
        run: |
          test -n "$GATEHOUSE_ORIGIN" || {
            echo "Set the GATEHOUSE_ORIGIN repository variable to the deployed Gatehouse URL." >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/gatehouse-verify"
          npm install \
            --prefix "$RUNNER_TEMP/gatehouse-verify" \
            --no-save \
            --no-package-lock \
            --ignore-scripts \
            playwright@1.62.1

      - name: Replay receipt against pinned builds
        working-directory: ${{ runner.temp }}/gatehouse-verify
        run: |
          node --input-type=module <<'VERIFY_SCRIPT'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { chromium } from "playwright";

          const MAX_COMPRESSED_BYTES = 64 * 1024;
          const MAX_DECOMPRESSED_BYTES = 32 * 1024;
          const VERIFIED_LABEL = "self-consistent ✓";
          const HEX_64 = /^[a-f0-9]{64}$/;

          function requireRecord(value, name) {
            assert(value && typeof value === "object" && !Array.isArray(value), `${name} must be an object`);
          }

          function requireString(value, name) {
            assert(typeof value === "string" && value.length > 0, `${name} must be a non-empty string`);
          }

          function requireSha(value, name) {
            assert(typeof value === "string" && HEX_64.test(value), `${name} must be a lowercase SHA-256`);
          }

          function validateArtifact(artifact) {
            requireRecord(artifact, "artifact");
            assert.equal(artifact.v, 2, "artifact.v must be 2");
            for (const field of ["targetId", "library", "badVersion", "goodVersion", "repro", "signedAt", "ua"]) {
              requireString(artifact[field], `artifact.${field}`);
            }
            requireSha(artifact.badSha256, "artifact.badSha256");
            requireSha(artifact.goodSha256, "artifact.goodSha256");
            requireSha(artifact.reproSha256, "artifact.reproSha256");
            assert(new TextEncoder().encode(artifact.repro).byteLength <= 8192, "artifact.repro exceeds 8KB");
            assert.equal(artifact.green, true, "artifact must record a green differential");
            assert.equal(artifact.reason, "STABLE_LOCAL_DIFFERENTIAL", "artifact reason is not stable");
            assert.equal(artifact.stable, true, "artifact must record stable evidence");
            assert.equal(artifact.repeats, 5, "artifact must record five repeats per build");
            requireRecord(artifact.samples, "artifact.samples");
            for (const [version, expectedVerdict, bundleSha256] of [
              ["bad", "fail", artifact.badSha256],
              ["good", "pass", artifact.goodSha256],
            ]) {
              const samples = artifact.samples[version];
              assert(Array.isArray(samples), `artifact.samples.${version} must be an array`);
              assert.equal(samples.length, artifact.repeats, `artifact.samples.${version} must contain five samples`);
              for (const [index, sample] of samples.entries()) {
                requireRecord(sample, `artifact.samples.${version}[${index}]`);
                assert.equal(sample.verdict, expectedVerdict, `${version} sample ${index} verdict changed`);
                requireSha(sample.bundleSha256, `${version} sample ${index} bundleSha256`);
                assert.equal(sample.bundleSha256, bundleSha256, `${version} sample ${index} bundle hash changed`);
                assert(Number.isFinite(sample.durationMs) && sample.durationMs >= 0, `${version} sample ${index} duration is invalid`);
                assert(!Object.hasOwn(sample, "logs"), `${version} sample ${index} leaked logs into the public receipt`);
              }
            }
            assert(!Object.hasOwn(artifact, "runs"), "artifact v2 must not use the v1 runs field");
            assert(Array.isArray(artifact.timeline), "artifact.timeline must be an array");
            assert(artifact.issueUrl === null || typeof artifact.issueUrl === "string", "artifact.issueUrl is invalid");
            assert(["real", "seed"].includes(artifact.targetKind), "artifact.targetKind is invalid");
          }

          function assertTargetMatchesArtifact(target, artifact) {
            requireRecord(target, "target info");
            assert.equal(target.targetId, artifact.targetId, "headless replay used a different target");
            assert.equal(target.library, artifact.library, "headless replay library changed");
            assert.equal(target.targetKind, artifact.targetKind, "headless replay target kind changed");
            assert.equal(target.badVersion, artifact.badVersion, "headless replay reported-bad version changed");
            assert.equal(target.goodVersion, artifact.goodVersion, "headless replay comparison version changed");
            assert.equal(target.badSha256, artifact.badSha256, "headless replay bad bundle hash changed");
            assert.equal(target.goodSha256, artifact.goodSha256, "headless replay good bundle hash changed");
            assert.equal(target.issueUrl, artifact.issueUrl, "headless replay issue URL changed");
          }

          function runsByVersion(runs, name) {
            assert(Array.isArray(runs) && runs.length === 2, `${name} must contain two runs`);
            const indexed = Object.fromEntries(runs.map((run) => {
              requireRecord(run, `${name} run`);
              assert(["bad", "good"].includes(run.version), `${name} has an invalid run version`);
              assert(["pass", "fail", "error", "timeout"].includes(run.verdict), `${name} has an invalid verdict`);
              return [run.version, run];
            }));
            assert(indexed.bad && indexed.good, `${name} must have bad and good runs`);
            return indexed;
          }

          function parseToolValue(value) {
            if (typeof value === "string") {
              try {
                return parseToolValue(JSON.parse(value));
              } catch {
                return value;
              }
            }
            if (value?.structuredContent) return parseToolValue(value.structuredContent);
            if (Array.isArray(value?.content)) {
              const text = value.content.find((item) => typeof item?.text === "string")?.text;
              if (text) return parseToolValue(text);
            }
            return value;
          }

          const configuredBase = new URL(process.env.GATEHOUSE_ORIGIN);
          assert(["https:", "http:"].includes(configuredBase.protocol), "GATEHOUSE_ORIGIN must use HTTP(S)");
          assert(!configuredBase.username && !configuredBase.password, "GATEHOUSE_ORIGIN must not contain credentials");
          assert(!configuredBase.search && !configuredBase.hash, "GATEHOUSE_ORIGIN must not contain a query or fragment");
          if (!configuredBase.pathname.endsWith("/")) configuredBase.pathname += "/";

          const receiptPrefix = new URL("receipt.html#a=", configuredBase).href;
          const receiptOffset = process.env.COMMENT_BODY.indexOf(receiptPrefix);
          assert(receiptOffset >= 0, `comment must contain a receipt from ${configuredBase.origin}`);
          const receiptMatch = process.env.COMMENT_BODY
            .slice(receiptOffset + receiptPrefix.length)
            .match(/^([A-Za-z0-9_-]+)&h=([a-f0-9]{64})/);
          assert(receiptMatch, "receipt fragment is missing or malformed");
          const [, encoded, expectedReceiptSha256] = receiptMatch;
          const receiptUrl = new URL(
            `receipt.html#a=${encoded}&h=${expectedReceiptSha256}`,
            configuredBase,
          );

          const browser = await chromium.launch({
            channel: "chrome",
            headless: true,
            args: ["--enable-features=WebMCPTesting"],
          });

          try {
            const page = await browser.newPage();
            await page.goto(receiptUrl.href, { waitUntil: "domcontentloaded" });
            await page.waitForFunction(
              (label) => document.body?.textContent?.includes(label),
              VERIFIED_LABEL,
              { timeout: 15_000 },
            );

            const decodedReceipt = await page.evaluate(async ({ maxCompressed, maxDecompressed }) => {
              const params = new URLSearchParams(location.hash.slice(1));
              const encodedPayload = params.get("a");
              if (!encodedPayload) throw new Error("receipt fragment is malformed");
              const padded = encodedPayload.replace(/-/g, "+").replace(/_/g, "/")
                .padEnd(Math.ceil(encodedPayload.length / 4) * 4, "=");
              const compressed = Uint8Array.from(atob(padded), (character) => character.charCodeAt(0));
              if (compressed.byteLength > maxCompressed) throw new Error("receipt payload exceeds 64KB");

              const reader = new Blob([compressed]).stream()
                .pipeThrough(new DecompressionStream("deflate-raw"))
                .getReader();
              const chunks = [];
              let size = 0;
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                size += value.byteLength;
                if (size > maxDecompressed) {
                  await reader.cancel();
                  throw new Error("decompressed receipt exceeds 32KB");
                }
                chunks.push(value);
              }
              const bytes = new Uint8Array(size);
              let offset = 0;
              for (const chunk of chunks) {
                bytes.set(chunk, offset);
                offset += chunk.byteLength;
              }
              return {
                artifact: JSON.parse(new TextDecoder().decode(bytes)),
                expectedReceiptSha256: params.get("h"),
              };
            }, {
              maxCompressed: MAX_COMPRESSED_BYTES,
              maxDecompressed: MAX_DECOMPRESSED_BYTES,
            });

            const { artifact } = decodedReceipt;
            validateArtifact(artifact);
            const receiptSha256 = createHash("sha256").update(JSON.stringify(artifact)).digest("hex");
            assert.equal(
              receiptSha256,
              decodedReceipt.expectedReceiptSha256,
              "receipt content hash does not match its public projection",
            );
            const reproSha256 = createHash("sha256").update(artifact.repro).digest("hex");
            assert.equal(reproSha256, artifact.reproSha256, "receipt repro hash does not match its code");

            const replayUrl = new URL(configuredBase);
            await page.goto(replayUrl.href, { waitUntil: "domcontentloaded" });
            await page.waitForFunction(
              () => typeof document.modelContext?.getTools === "function"
                && typeof document.modelContext?.executeTool === "function",
              null,
              { timeout: 15_000 },
            );

            const replayValues = await page.evaluate(async (repro) => {
              const api = document.modelContext;
              const execute = async (name, args) => {
                const tools = await api.getTools();
                const tool = tools.find((candidate) => candidate.name === name);
                if (!tool) throw new Error(`WebMCP tool not found: ${name}`);
                const value = await api.executeTool(tool, JSON.stringify(args));
                if (typeof value !== "string") {
                  throw new TypeError("Native WebMCP executeTool must return a JSON string");
                }
                return JSON.parse(value);
              };
              const target = await execute("get_target_info", {});
              const written = await execute("write_repro", { code: repro });
              const replay = await execute("run_repro", {});
              return { replay, target, written };
            }, artifact.repro);
            const target = parseToolValue(replayValues.target);
            const written = parseToolValue(replayValues.written);
            const parsedReplay = parseToolValue(replayValues.replay);
            const replay = parsedReplay?.differential ?? parsedReplay?.result ?? parsedReplay;

            assertTargetMatchesArtifact(target, artifact);
            requireRecord(written, "write result");
            assert.equal(written.reproSha256, artifact.reproSha256, "headless replay used different repro code");
            requireRecord(replay, "replay result");
            assert.equal(replay.green, true, "headless replay did not reproduce a stable local differential");
            assert.equal(replay.reason, "STABLE_LOCAL_DIFFERENTIAL", "headless replay reason changed");
            assert.equal(replay.stable, true, "headless replay was not stable");
            assert.equal(replay.repeats, artifact.repeats, "headless replay repeat count changed");

            const replayRuns = runsByVersion(replay.runs, "replay.runs");
            for (const [version, expectedVerdict] of [
              ["bad", "fail"],
              ["good", "pass"],
            ]) {
              assert.equal(replayRuns[version].verdict, expectedVerdict, `${version} verdict changed`);
            }
          } finally {
            await browser.close();
          }
          VERIFY_SCRIPT

      - name: Add server-verified label
        uses: actions/github-script@v7
        with:
          script: |
            const label = "server-verified";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: "1a7f37",
                description: "Gatehouse receipt replayed against its pinned builds",
              });
            }
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: context.issue.number,
              labels: [label],
            });
