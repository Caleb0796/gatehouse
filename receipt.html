<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatehouse receipt</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #111827; color: #e5e7eb; }
  main { box-sizing: border-box; width: min(960px, 100%); margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin-bottom: 8px; }
  h2 { margin-top: 32px; border-bottom: 1px solid #374151; padding-bottom: 8px; }
  h3 { margin-top: 24px; }
  .guidance { color: #cbd5e1; }
  .claim-states { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 24px 0; }
  .verification { margin: 0; padding: 16px; border: 2px solid; border-radius: 12px; font-size: 1rem; font-weight: 800; }
  .verified { border-color: #22c55e; background: #052e16; color: #86efac; }
  .unverified { border-color: #f59e0b; background: #451a03; color: #fcd34d; }
  .error { border-color: #ef4444; background: #450a0a; color: #fecaca; }
  dl { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 8px 16px; }
  dt { color: #94a3b8; font-weight: 700; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .download { display: inline-block; margin-top: 24px; padding: 10px 16px; border-radius: 8px; background: #2563eb; color: white; font-weight: 700; text-decoration: none; }
  .json-import { margin-top: 32px; padding: 20px; border: 1px solid #475569; border-radius: 12px; }
  .json-import h2 { margin-top: 0; }
  .import-status { min-height: 1.5em; color: #fcd34d; }
  @media (max-width: 600px) { dl { grid-template-columns: 1fr; } dd { margin-bottom: 8px; } }
</style>
</head>
<body>
<main id="receipt-root">
  <h1>Gatehouse receipt</h1>
  <p class="guidance">This page displays reporter-generated local evidence and its explicit verification limits.</p>
  <p>Loading receipt…</p>
</main>
<script type="module" src="/src/inbox/receipt-page.js"></script>
</body>
</html>
